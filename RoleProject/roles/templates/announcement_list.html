{% extends "base.html" %}

{% block content %}
<style>
    body { background: radial-gradient(circle at top, #0f172a 0%, #020617 100%); min-height: 100vh; color: #f8fafc; }
    .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 20px; padding: 40px; max-width: 800px; margin: 50px auto; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .announcement-item { background: rgba(255, 255, 255, 0.03); border-left: 4px solid #38bdf8; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
</style>

<div class="container">
    <div class="glass-panel text-center">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 style="color: #38bdf8;"><i class="fas fa-comment-dots me-2"></i> Company Announcements</h2>
            <a href="{% url 'manager_dashboard' %}" class="btn btn-outline-info btn-sm"></a>
        </div>

        <div class="text-start">
            {% for announcement in announcements %}
                <div class="announcement-item">
                    <h4 class="text-info">{{ announcement.title }}</h4>
                    <p>{{ announcement.content }}</p>
                    <small class="text-muted">Posted: {{ announcement.created_at|date:"M d, Y" }}</small>
                </div>
            {% empty %}
                <p class="text-muted py-4 text-center">No active announcements.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
