<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events | Manager View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 40px;
            font-family: 'Segoe UI', sans-serif;
        }
        .glass-container {
            background: rgba(41, 128, 185, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .event-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #00bcd4; /* Neon Teal */
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 20px;
            transition: transform 0.3s;
        }
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.4);
        }
        .event-date {
            color: #00bcd4;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .btn-back {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-back:hover { background: #00bcd4; color: black; }
    </style>
</head>
<body>
    <div class="container glass-container">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1><i class="fas fa-bullhorn me-3" style="color: #00bcd4;"></i>Upcoming Events</h1>
            <a href="{% url 'manager_dashboard' %}" class="btn btn-back">Back to Dashboard</a>
        </div>

        <div class="row">
            {% for event in events %}
                <div class="col-md-6">
                    <div class="event-card">
                        <div class="event-date">
                            <i class="far fa-calendar-alt me-2"></i>{{ event.date|date:"F d, Y" }} 
                            <span class="ms-3"><i class="far fa-clock me-2"></i>{{ event.start_time }}</span>
                        </div>
                        <h3 class="mt-2">{{ event.title }}</h3>
                        <p class="text-secondary">{{ event.description|truncatewords:20 }}</p>
                        <div class="mt-3">
                            <span class="badge bg-info text-dark">{{ event.location|default:"Office" }}</span>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12 text-center py-5">
                    <p class="text-muted">No upcoming events have been scheduled by Admin.</p>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
