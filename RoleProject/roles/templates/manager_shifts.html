<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Shifts | Manager View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 30px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .table { color: #fff; }
        .table th { color: #00bcd4; border-bottom: 2px solid #00bcd4; }
        .badge-time { background-color: #00bcd4; color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container glass-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-clock"></i> Team Shift Schedule</h2>
            <a href="{% url 'manager_dashboard' %}" class="btn btn-sm btn-outline-light">Back to Dashboard</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Employee Name</th>
                    <th>Shift Duration</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                {% for shift in shifts %}
                <tr>
                    <td>{{ shift.date }}</td>
                    <td><strong>{{ shift.employee.username }}</strong></td>
                    <td><span class="badge badge-time">{{ shift.start_time }} - {{ shift.end_time }}</span></td>
                    <td>{{ shift.notes|default:"--" }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted">No shifts have been assigned by Admin yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
