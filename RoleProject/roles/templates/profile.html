{% extends "base.html" %}

{% block content %}
<style>
    body { background: radial-gradient(circle at top, #0f172a 0%, #020617 100%); min-height: 100vh; color: #f8fafc; }
    .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 20px; padding: 40px; max-width: 600px; margin: 50px auto; text-align: center; }
    .profile-avatar { font-size: 5rem; color: #38bdf8; margin-bottom: 20px; }
    .info-label { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; margin-top: 15px; }
    .info-value { font-size: 1.2rem; font-weight: 600; color: #f8fafc; }
</style>

<div class="container">
    <div class="glass-panel">
        <i class="fas fa-user-circle profile-avatar"></i>
        <h2 class="mb-4">User Profile</h2>
        
        <div class="text-start">
            <p class="info-label">Username</p>
            <p class="info-value">{{ user.username }}</p>

            <p class="info-label">Email Address</p>
            <p class="info-value">{{ user.email|default:"No email provided" }}</p>

            <p class="info-label">Role</p>
            <p class="info-value text-info">{{ user.userprofile.role }}</p>
        </div>

        <a href="javascript:history.back()" class="btn btn-outline-info mt-4 w-100">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
