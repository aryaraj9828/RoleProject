{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Clock</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* --- Base Page Styles (Dark Blue-Black Gradient) --- */
        body {
            /* Using the requested dark blue-black gradient */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px; 
            color: #ecf0f1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Glassy Card Styling --- */
        .attendance-card {
            background: rgba(44, 83, 100, 0.2); /* Semi-transparent blue */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            margin-top: 50px;
            margin-bottom: 50px;
        }
        
        .attendance-card h2 {
            color: #00d2ff;
            margin-bottom: 20px;
        }

        .time-display {
            font-size: 3.5rem;
            color: #00d2ff;
            margin: 25px 0;
            font-weight: bold;
            /* Simple glow effect for the time */
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6); 
        }
        
        .btn-success:disabled {
            background-color: #19875455; /* Lighter success shade when disabled */
            border-color: #19875455;
            cursor: not-allowed;
        }
        
        .btn-danger:disabled {
            background-color: #dc354555; /* Lighter danger shade when disabled */
            border-color: #dc354555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="attendance-card">
        <h2>Attendance Clock for **{{ user.username }}**</h2>

        <p class="time-display" id="current-time">Loading...</p>

        {% if message %}
            <div class="alert alert-info mt-4" role="alert">
                **{{ message }}**
            </div>
        {% endif %}

        <form method="post" action="{% url 'admin_attendance_page' %}" class="d-flex justify-content-center gap-3">
            {% csrf_token %}
            
            <button type="submit" 
                    name="action" 
                    value="clock_in" 
                    class="btn btn-success btn-lg"
                    {% if is_clocked_in %}disabled{% endif %}
            >
                <i class="fas fa-arrow-right-to-bracket"></i> **Clock In**
            </button>
            
            <button type="submit" 
                    name="action" 
                    value="clock_out" 
                    class="btn btn-danger btn-lg"
                    {% if not is_clocked_in %}disabled{% endif %}
            >
                <i class="fas fa-arrow-right-from-bracket"></i> **Clock Out**
            </button>
        </form>

        <div class="mt-4">
            <a href="{% url 'role_redirect' %}" class="btn btn-outline-primary">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        // JavaScript to display the current time
        function updateTime() {
            const now = new Date();
            // Format the time as HH:MM:SS
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true
            });
            document.getElementById('current-time').textContent = timeString;
        }

        // Update the time every second
        setInterval(updateTime, 1000);
        updateTime(); // Initial call to display time immediately
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
