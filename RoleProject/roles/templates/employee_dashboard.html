<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* --- CSS Variables for the Neon Theme --- */
        :root {
            --neon-bg-dark: rgba(0, 0, 0, 0.4); /* Dark background with transparency */
            --neon-border-color: #00bcd4; /* Cyan/Teal color */
            --neon-glow-color: #00bcd4;
            --neon-text-color: #ffffff;
        }

        /* --- Base Page Styles --- */
        body {
            /* Using a simple dark color and image, ensuring full screen coverage */
            background-color: #2c3e50;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-size: cover;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px; 
            color: #ecf0f1; 
        }

        /* --- Fixed Top-Right Logout Button --- */
        .top-navbar {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .logout-button {
            background-color: rgba(255, 255, 255, 0.6);
            color: #333;
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        /* --- Main Dashboard Wrapper (Glassy Effect) --- */
        .dashboard-wrapper {
            background: rgba(41, 128, 185, 0.2); /* Semi-transparent blue */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 30px;
        }

        /* --- Profile Card Styling --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(5px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
        }

        .profile-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 15px;
        }

        .details-button {
            background-color: #3498db;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s;
        }

        /* --- Dashboard Card Styles (Horizontal Grid) --- */
        .card-link {
            display: flex;
            text-decoration: none;
            width: 100%; 
        }

        .dashboard-card {
            width: 150px; 
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px; 
            text-align: center;
            
            /* Neon/Dark Card Styling */
            background-color: var(--neon-bg-dark); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: var(--neon-text-color);
            border: 2px solid var(--neon-border-color);
            
            /* Initial subtle glow */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7), 0 0 15px var(--neon-glow-color);
            
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        .dashboard-card:hover {
            transform: scale(1.05);
            /* Intense glow on hover */
            box-shadow: 0 0 25px rgba(0, 0, 0, 1), 0 0 35px var(--neon-glow-color); 
        }

        .dashboard-card .icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: var(--neon-text-color);
            text-shadow: 0 0 5px var(--neon-glow-color);
        }

        .dashboard-card .card-text {
            font-weight: 600;
            font-size: 1rem;
            color: var(--neon-text-color);
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center">

    <div class="top-navbar">
        <a href="{% url 'logout' %}" class="logout-button">Logout</a>
    </div>

    <div class="container my-5 dashboard-wrapper"> 
        <h1 class="text-center">Employee Dashboard</h1>

        <div class="row justify-content-center mb-5">
            <div class="col-12 col-lg-6"> 
                <div class="profile-card">
                    <img src="https://i.pravatar.cc/150?img={{ user.id }}" alt="Profile Picture"> 
                    <h2>Welcome, {{ user.first_name|default:user.username }}!</h2>
                    <p><strong>Email:</strong> {{ user.email }}</p>
                    <p><strong>Role:</strong> Employee</p> 
                    
                    <a href="{% url 'profile' %}" class="details-button">View Profile Details</a>
                </div>
            </div>
        </div>
        
        <div class="row justify-content-center">
            
            <div class="col-6 col-md-3 mb-4 d-flex justify-content-center">
                <a href="{% url 'profile' %}" class="card-link">
                    <div class="dashboard-card">
                        <i class="icon fas fa-user-circle"></i>
                        <div class="card-text">My Profile</div>
                    </div>
                </a>
            </div>
            
            <div class="col-6 col-md-3 mb-4 d-flex justify-content-center">
                <a href="{% url 'employee_attendance' %}" class="card-link">
                    <div class="dashboard-card">
                        <i class="icon fas fa-calendar-check"></i>
                        <div class="card-text">Attendance</div>
                    </div>
                </a>
            </div> 
            
            <div class="col-6 col-md-3 mb-4 d-flex justify-content-center">
                <a href="{% url 'employee_shifts' %}" class="card-link">
                    <div class="dashboard-card">
                        <i class="icon fas fa-clock"></i>
                        <div class="card-text">My Shifts</div>
                    </div>
                </a>
            </div>
            
            <div class="col-6 col-md-3 mb-4 d-flex justify-content-center">
                <a href="{% url 'leave_request_submit' %}" class="card-link">
                    <div class="dashboard-card">
                        <i class="icon fas fa-plane-departure"></i>
                        <div class="card-text">Leave Request</div>
                    </div>
                </a>
            </div>
            
            <div class="col-6 col-md-3 mb-4 d-flex justify-content-center">
                <a href="{% url 'announcement_list' %}" class="card-link">
                    <div class="dashboard-card">
                        <i class="icon fas fa-bullhorn"></i>
                        <div class="card-text">Announcements</div>
                    </div>
                </a>
            </div>
            
            <div class="col-6 col-md-3 mb-4 d-flex justify-content-center">
                <a href="{% url 'employee_events_calendar' %}" class="card-link">
                    <div class="dashboard-card">
                        <i class="icon fas fa-calendar-alt"></i>
                        <div class="card-text">Events & Calendar</div>
                    </div>
                </a>
            </div>
            
            

            <div class="col-6 col-md-3 mb-4 d-flex justify-content-center">
                <a href="{% url 'employee_timesheet' %}" class="card-link">
                    <div class="dashboard-card">
                        <i class="icon fas fa-tasks"></i>
                        <div class="card-text">Timesheet</div>
                    </div>
                </a>
            </div>
            
        </div>
        </div> 
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
