{% extends "base.html" %} 

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container my-5 dashboard-wrapper"> 
    <h1 class="text-center">{{ page_title }}</h1>
    
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            <div class="profile-card p-4">
                <p class="text-white">This form is for updating the manager's profile information.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="alert alert-warning mt-3">
                        <i class="fas fa-exclamation-triangle"></i> Placeholder: Actual form fields go here!
                    </div>
                    
                    <button type="submit" class="btn details-button mt-4">Save Changes</button>
                    <a href="{% url 'manager_profile' %}" class="btn btn-secondary mt-4 ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
