{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-card">
        <h2>Log In</h2>

        <form method="post">
            {% csrf_token %}

            {# NOTE: If you are using form.as_p, you might need to adjust styles for labels/fields #}
            {{ form.as_p }}

            <button type="submit">Log In</button>
        </form>

        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>

    </div>

    <style>
        /* C:\PVSY\RoleProject\roles\static\css\style.css */

/* --- General Styling and Background --- */
* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Dark blue-black gradient */
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 16px;
    color: #f0f0f0; /* Light text color */
}

/* --- Login Card (Glassy Effect) --- */
.login-card {
    background: rgba(44, 83, 100, 0.2); /* Semi-transparent background */
    backdrop-filter: blur(10px); /* The KEY Glassy effect */
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: clamp(24px, 6vw, 40px);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    width: 100%;
    max-width: 400px;
    text-align: center;
    transition: transform 0.3s ease;
}

.login-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
}

h2 {
    color: #00d2ff; /* Bright blue heading color */
    margin-top: 0;
    margin-bottom: 25px;
    font-weight: 300;
    font-size: clamp(1.5rem, 6vw, 2rem);
}

/* --- Form Field Styling --- */
.login-card p {
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

.login-card label {
    display: block;
    text-align: left;
    font-size: 0.95rem;
}

.login-card input[type="text"],
.login-card input[type="password"],
.login-card input[type="email"] {
    width: 100%;
    padding: 12px 16px;
    margin: 8px 0;
    display: block;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05); /* Very light background for inputs */
    color: #f0f0f0;
    border: 1px solid rgba(255, 255, 255, 0.2);
    font-size: 16px; /* prevents iOS zoom on focus */
    transition: background 0.3s;
}

.login-card input:focus {
    background: rgba(255, 255, 255, 0.1);
    outline: none;
    border-color: #00d2ff;
}

/* --- Button Styling --- */
.login-card button {
    background: linear-gradient(90deg, #00bfff, #0080ff); /* Blue gradient button */
    color: white;
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    min-height: 44px;
    margin-top: 20px;
    font-size: 16px;
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.login-card button:hover {
    background: linear-gradient(90deg, #0080ff, #0056b3);
    box-shadow: 0 4px 15px rgba(0, 191, 255, 0.5);
}

/* --- Hyperlink Styling (Register here) --- */
.login-card a {
    color: #00d2ff;
    text-decoration: none;
    transition: color 0.3s;
}

.login-card a:hover {
    color: #4df0ff;
    text-decoration: underline;
}

/* Django Form Specifics (Cleans up the form.as_p structure) */
.login-card li {
    list-style: none;
}

.login-card ul {
    padding: 0;
    margin: 0 0 8px;
    text-align: left;
}

.login-card .errorlist li {
    color: #ff8a8a;
    font-size: 0.9rem;
}

.login-card .helptext {
    display: block;
    text-align: left;
    font-size: 0.8rem;
    opacity: 0.7;
}

/* --- Responsive --- */
@media (max-width: 480px) {
    body { align-items: flex-start; padding-top: 8vh; }
    .login-card:hover { transform: none; }
}

@media (max-height: 520px) and (orientation: landscape) {
    body { align-items: flex-start; padding-top: 16px; }
}
    </style>
    </body>
</html>
