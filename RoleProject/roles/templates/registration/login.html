{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-card">
        <h2>Log In</h2>

        <form method="post">
            {% csrf_token %}
            
            {# NOTE: If you are using form.as_p, you might need to adjust styles for labels/fields #}
            {{ form.as_p }}
            
            <button type="submit">Log In</button>
        </form>

        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
         
    </div>




    <style>
        /* C:\PVSY\RoleProject\roles\static\css\style.css */

/* --- General Styling and Background --- */
body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Dark blue-black gradient */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: #f0f0f0; /* Light text color */
}

/* --- Login Card (Glassy Effect) --- */
.login-card {
    background: rgba(44, 83, 100, 0.2); /* Semi-transparent background */
    backdrop-filter: blur(10px); /* The KEY Glassy effect */
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 40px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    width: 350px;
    text-align: center;
    transition: transform 0.3s ease;
}

.login-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
}

h2 {
    color: #00d2ff; /* Bright blue heading color */
    margin-bottom: 25px;
    font-weight: 300;
}

/* --- Form Field Styling --- */
.login-card p {
    margin-bottom: 15px;
}

.login-card input[type="text"],
.login-card input[type="password"],
.login-card input[type="email"] {
    width: 100%;
    padding: 12px 20px;
    margin: 8px 0;
    display: inline-block;
    border: none;
    border-radius: 10px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.05); /* Very light background for inputs */
    color: #f0f0f0;
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: background 0.3s;
}

.login-card input:focus {
    background: rgba(255, 255, 255, 0.1);
    outline: none;
    border-color: #00d2ff;
}

/* --- Button Styling --- */
.login-card button {
    background: linear-gradient(90deg, #00bfff, #0080ff); /* Blue gradient button */
    color: white;
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    margin-top: 20px;
    font-size: 16px;
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.login-card button:hover {
    background: linear-gradient(90deg, #0080ff, #0056b3);
    box-shadow: 0 4px 15px rgba(0, 191, 255, 0.5);
}

/* --- Hyperlink Styling (Register here) --- */
.login-card a {
    color: #00d2ff;
    text-decoration: none;
    transition: color 0.3s;
}

.login-card a:hover {
    color: #4df0ff;
    text-decoration: underline;
}

/* Django Form Specifics (Cleans up the form.as_p structure) */
.login-card li {
    list-style: none;
}
    </style>
    </body>
</html>
